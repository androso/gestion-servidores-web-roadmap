<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Validador de Expresiones - UNIVO</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="reto">
    <h1>🧩 Validador de Expresiones</h1>
    <p>Ingresa una expresión con paréntesis, corchetes o llaves.</p>

    <input type="text" id="expresion" placeholder='Ej: {[(2+3)*5] - [4*(1+2)]}'>

    <button id="btnValidar">Validar</button>

    <div id="resultado" aria-live="polite"></div>
  </main>

  <script src="dist/app.js"></script>
</body>
</html>
